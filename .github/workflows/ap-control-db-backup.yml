name: AP Control DB Backup

# Automatic weekly logical backup of the AP Control Neon database (a complete pg_dump),
# stored as a downloadable GitHub artifact — an off-platform copy, separate from Neon & Vercel.
#
# One-time setup (owner): add a repository secret named DATABASE_URL
#   GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret
#   Use Neon's DIRECT (non-pooled) connection string — the "-pooler" endpoint can't be dumped.
#
# Retrieve a backup: repo -> Actions -> "AP Control DB Backup" -> a run -> Artifacts.
# Retention is 90 days; for the 7-year record-keeping requirement, download copies periodically
# to storage you control (Drive / disk). "Run workflow" also triggers a backup on demand.

on:
  schedule:
    - cron: '0 3 * * 0' # every Sunday 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: pg_dump (PostgreSQL client via docker) and compress
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret is not set. Add it in repo Settings -> Secrets -> Actions."
            exit 1
          fi
          IMG=postgres:18-alpine
          OUT="ap-control-db-$(date +%F).sql.gz"

          # Print the pg_dump client version. If the client is older than the Neon server, pg_dump
          # aborts with a clear "server version mismatch" — now visible via the captured stderr below,
          # so no separate psql probe (which would put the password in argv) is needed.
          echo "pg_dump client: $(docker run --rm "$IMG" pg_dump --version)"

          # Dump to a plain file (NOT straight into a pipe) so pg_dump's real exit code and stderr are
          # visible instead of being swallowed by 'gzip: Broken pipe'.
          set +e
          docker run --rm "$IMG" \
            pg_dump --no-owner --no-privileges --format=plain "$DATABASE_URL" > dump.sql 2> pgerr.txt
          code=$?
          set -e

          if [ "$code" -ne 0 ]; then
            echo "::error::pg_dump exited $code — see its output below."
            echo "----- pg_dump stderr -----"; cat pgerr.txt
            exit 1
          fi
          # Integrity guard: a real dump defines tables. Exit 0 with no tables means we connected to
          # the wrong database/branch, an empty DB, or the pooled '-pooler' endpoint. Fail loudly.
          if ! grep -q "CREATE TABLE" dump.sql; then
            echo "::error::pg_dump exit 0 but no CREATE TABLE. Likely the wrong database/branch or the pooled '-pooler' endpoint. Use Neon's DIRECT connection string."
            echo "----- pg_dump stderr -----"; cat pgerr.txt
            echo "----- first 30 lines of the dump -----"; head -30 dump.sql
            exit 1
          fi

          gzip -9 < dump.sql > "$OUT"
          echo "Wrote $OUT ($(du -h "$OUT" | cut -f1)), $(grep -c 'CREATE TABLE' dump.sql) tables"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ap-control-db-backup
          path: ap-control-db-*.sql.gz
          retention-days: 90
          if-no-files-found: error
