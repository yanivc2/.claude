name: AP Control DB Backup

# Automatic weekly logical backup of the AP Control Neon database (a complete pg_dump),
# stored as a downloadable GitHub artifact — an off-platform copy, separate from Neon & Vercel.
#
# One-time setup (owner): add a repository secret named DATABASE_URL
#   GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret
#   Use Neon's DIRECT (non-pooled) connection string — the "-pooler" endpoint can't be dumped.
#
# Retrieve a backup: repo -> Actions -> "AP Control DB Backup" -> a run -> Artifacts.
# Retention is 90 days; for the 7-year record-keeping requirement, download copies periodically
# to storage you control (Drive / disk). "Run workflow" also triggers a backup on demand.

on:
  schedule:
    - cron: '0 3 * * 0' # every Sunday 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: pg_dump (PostgreSQL 18 client, matches Neon) and compress
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret is not set. Add it in repo Settings -> Secrets -> Actions."
            exit 1
          fi
          OUT="ap-control-db-$(date +%F).sql.gz"
          # pg_dump 18 via docker so the client major matches Neon (server 18.x); stream through gzip.
          # pipefail makes a pg_dump failure fail the job instead of uploading a truncated/empty file.
          docker run --rm postgres:18-alpine \
            pg_dump --no-owner --no-privileges --format=plain "$DATABASE_URL" \
            | gzip -9 > "$OUT"
          # Integrity guard: a real dump defines tables. An empty/aborted dump does not — fail loudly
          # so a broken backup can never masquerade as a successful one.
          if ! zcat "$OUT" | grep -q "CREATE TABLE"; then
            echo "::error::backup contains no tables — pg_dump likely failed. Not a valid backup."
            exit 1
          fi
          echo "Wrote $OUT ($(du -h "$OUT" | cut -f1)), $(zcat "$OUT" | grep -c 'CREATE TABLE') tables"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ap-control-db-backup
          path: ap-control-db-*.sql.gz
          retention-days: 90
          if-no-files-found: error
