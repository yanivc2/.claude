# Daily bank scrape — the second bank channel (israeli-bank-scrapers).
#
# Runs here rather than on Vercel because the scrape drives a real Chromium, which a serverless
# function has no room for. The bank credentials live only in this repository's Secrets: the runner
# logs in, scrapes, and POSTs finished rows to /ingest/bank-txns. They never reach the app or Neon.
#
# Secrets to set (Settings → Secrets and variables → Actions):
#   BANK_SCRAPERS  JSON array of {companyId, credentials} — see scripts/scrape-push.mjs
#   CRON_SECRET    the same value the app has in Vercel
#   AP_INGEST_URL  https://ap-control.vercel.app   (a Variable is fine, it is not secret)
name: bank-scrape

on:
  schedule:
    # 04:20 UTC ≈ 07:20 Israel — after the bank has posted overnight, offset from the Financy cron.
    - cron: '20 4 * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Scrape from this date (YYYY-MM-DD). Empty = the default window.'
        required: false
      dry_run:
        description: 'Scrape and print, POST nothing'
        type: boolean
        default: false
      debug:
        description: 'Capture a screenshot of the page when login fails (private artifact, 1 day)'
        type: boolean
        default: false

# Never let two scrapes overlap: a second login while the first is live can trip a bank's
# fraud controls, and both would write the same rows.
concurrency:
  group: bank-scrape
  cancel-in-progress: false

jobs:
  scrape:
    # 🔴 מוצמד ל-22.04 ולא ubuntu-latest. ה-latest הוא Ubuntu 24.04, שחוסם unprivileged user
    # namespaces דרך AppArmor — ושם ארגז החול של Chrome אינו מצליח לאתחל והדפדפן קורס ב
    # "No usable sandbox!" עוד לפני שדף הבנק נטען (נמדד בהרצה 21). 22.04 מקדים את ההגבלה
    # ההיא, ולכן Chrome עולה שם **עם ארגז החול שלו דלוק** — בלי לגעת בשום הקשחה של המכונה
    # ובלי --no-sandbox, שהוא הפתרון הנפוץ ברשת אבל פשוט מכבה את ארגז החול. הדפדפן הזה
    # מתחבר לחשבון בנק, אז ההפרדה הזו שווה הצמדה.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # israeli-bank-scrapers is an OPTIONAL dependency of the app — only this runner needs it,
      # and it pulls its own Chromium (a few hundred MB), so it is installed here, not in the app.
      - name: Install scraper
        run: npm install --no-save israeli-bank-scrapers

      - name: Scrape and push
        env:
          BANK_SCRAPERS: ${{ secrets.BANK_SCRAPERS }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AP_INGEST_URL: ${{ vars.AP_INGEST_URL || 'https://ap-control.vercel.app' }}
          BANK_SCRAPE_DAYS: ${{ vars.BANK_SCRAPE_DAYS || '90' }}
          SCRAPE_DEBUG: ${{ inputs.debug == true && '1' || '' }}
          SCRAPE_SHOT_DIR: scrape-debug
        run: |
          node scripts/scrape-push.mjs \
            ${{ inputs.start_date }} \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      # 🔴 רק על כישלון, ורק כשביקשו אבחון. התמונה מראה את דף הבנק ברגע התקיעה — זה מה שמבדיל
      # בין סיסמה שגויה, דרישת אימות דו-שלבי, וחסימה של הבנק על כתובת IP של חוות שרתים; שלושתם
      # נראים בלוג כאותו "TIMEOUT". הריפו פרטי, והשמירה מוגבלת ליום אחד — זו ראיה לחקירה אחת,
      # לא ארכיון.
      - name: Upload failure screenshot
        if: failure() && inputs.debug == true
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug
          path: scrape-debug/
          retention-days: 1
          if-no-files-found: ignore
